[pytest]
# Raiz do projeto no caminho de importação: permite "from src.utils.files import ..." sem "../"
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*
# Gera o relatório padrão (pytest-html) e os dados do Allure a cada execução; repete 1 vez o teste que falhar
addopts = --import-mode=importlib -v --reruns 1 --html=pytest-report/report.html --self-contained-html --alluredir=allure-results --clean-alluredir
